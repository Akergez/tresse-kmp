stages:
  - native
  - publish

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_VERSION: "9.2.1"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_NDK_VERSION: "27.0.12077973"
  RUST_VERSION: "1.93.1"
  TRESSE_REPOSITORY_URL: "https://gitlab.com/ragusseven/tresse.git"
  TRESSE_REF: "3b5a840d2bcff3f95863d90ee59d61ed9a95ebb9"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle-dist
    - .android-sdk

.release_rules: &release_rules
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$/'

native:linux-x86_64:
  stage: native
  image: rust:1.93.1-bookworm
  before_script:
    - apt-get update && apt-get install -y git
    - mkdir -p .deps
    - git clone "$TRESSE_REPOSITORY_URL" .deps/tresse
    - git -C .deps/tresse checkout "$TRESSE_REF"
    - test "$(git -C .deps/tresse rev-parse HEAD)" = "$TRESSE_REF"
  script:
    - cargo build --manifest-path .deps/tresse/Cargo.toml --release -p tresse-ffi
    - mkdir -p .native/native/linux-x86_64
    - cp .deps/tresse/target/release/libtresse_ffi.so .native/native/linux-x86_64/
  artifacts:
    paths:
      - .native/native/linux-x86_64/libtresse_ffi.so
  <<: *release_rules

native:linux-aarch64:
  stage: native
  image: rust:1.93.1-bookworm
  tags:
    - saas-linux-small-arm64
  before_script:
    - apt-get update && apt-get install -y git
    - mkdir -p .deps
    - git clone "$TRESSE_REPOSITORY_URL" .deps/tresse
    - git -C .deps/tresse checkout "$TRESSE_REF"
    - test "$(git -C .deps/tresse rev-parse HEAD)" = "$TRESSE_REF"
  script:
    - cargo build --manifest-path .deps/tresse/Cargo.toml --release -p tresse-ffi
    - mkdir -p .native/native/linux-aarch64
    - cp .deps/tresse/target/release/libtresse_ffi.so .native/native/linux-aarch64/
  artifacts:
    paths:
      - .native/native/linux-aarch64/libtresse_ffi.so
  <<: *release_rules

native:macos-arm64:
  stage: native
  tags:
    - macos-arm64
  before_script:
    - mkdir -p .deps
    - git clone "$TRESSE_REPOSITORY_URL" .deps/tresse
    - git -C .deps/tresse checkout "$TRESSE_REF"
    - test "$(git -C .deps/tresse rev-parse HEAD)" = "$TRESSE_REF"
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
    - export PATH="$HOME/.cargo/bin:$PATH"
  script:
    - cargo build --manifest-path .deps/tresse/Cargo.toml --release -p tresse-ffi
    - mkdir -p .native/native/macos-aarch64
    - cp .deps/tresse/target/release/libtresse_ffi.dylib .native/native/macos-aarch64/
  artifacts:
    paths:
      - .native/native/macos-aarch64/libtresse_ffi.dylib
  <<: *release_rules

# PowerShell runner, so the whole job reads differently from its POSIX siblings.
# `before_script` and `script` share one shell, hence the single PATH assignment.
# MSVC comes with the runner image; only rustup has to be fetched.
native:windows-x86_64:
  stage: native
  tags:
    - saas-windows-medium-amd64
  before_script:
    - git clone "$env:TRESSE_REPOSITORY_URL" .deps/tresse
    - git -C .deps/tresse checkout "$env:TRESSE_REF"
    - if ((git -C .deps/tresse rev-parse HEAD) -ne $env:TRESSE_REF) { throw "TRESSE_REF checkout mismatch" }
    - Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain "$env:RUST_VERSION" --default-host x86_64-pc-windows-msvc
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
  script:
    - cargo build --manifest-path .deps/tresse/Cargo.toml --release -p tresse-ffi
    - New-Item -ItemType Directory -Force -Path .native\native\windows-x86_64
    # No `lib` prefix on Windows; `System.mapLibraryName` in TresseNative expects exactly this.
    - Copy-Item .deps\tresse\target\release\tresse_ffi.dll .native\native\windows-x86_64\
  artifacts:
    paths:
      - .native/native/windows-x86_64/tresse_ffi.dll
  <<: *release_rules

native:android:
  stage: native
  image: rust:1.93.1-bookworm
  before_script:
    - apt-get update && apt-get install -y git wget unzip openjdk-17-jre-headless
    - mkdir -p .deps "$ANDROID_HOME/cmdline-tools"
    - git clone "$TRESSE_REPOSITORY_URL" .deps/tresse
    - git -C .deps/tresse checkout "$TRESSE_REF"
    - test "$(git -C .deps/tresse rev-parse HEAD)" = "$TRESSE_REF"
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
    - yes | sdkmanager --licenses || true
    - sdkmanager "ndk;$ANDROID_NDK_VERSION"
    - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    - cargo install cargo-ndk --version 4.1.2 --locked
  script:
    - export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
    - cd .deps/tresse
    - cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o "$CI_PROJECT_DIR/src/androidMain/jniLibs" build --release -p tresse-ffi
  artifacts:
    paths:
      - src/androidMain/jniLibs/arm64-v8a/libtresse_ffi.so
      - src/androidMain/jniLibs/armeabi-v7a/libtresse_ffi.so
      - src/androidMain/jniLibs/x86_64/libtresse_ffi.so
  <<: *release_rules

publish:maven:
  stage: publish
  image: eclipse-temurin:21-jdk
  needs:
    - job: native:linux-x86_64
      artifacts: true
    - job: native:linux-aarch64
      artifacts: true
    - job: native:macos-arm64
      artifacts: true
    - job: native:windows-x86_64
      artifacts: true
    - job: native:android
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - |
      if [ ! -x "$CI_PROJECT_DIR/.gradle-dist/gradle-$GRADLE_VERSION/bin/gradle" ]; then
        mkdir -p "$CI_PROJECT_DIR/.gradle-dist"
        wget -q "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -O gradle.zip
        unzip -q gradle.zip -d "$CI_PROJECT_DIR/.gradle-dist"
      fi
    - export PATH="$CI_PROJECT_DIR/.gradle-dist/gradle-$GRADLE_VERSION/bin:$PATH"
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0"
  script:
    - test -f .native/native/linux-x86_64/libtresse_ffi.so
    - test -f .native/native/linux-aarch64/libtresse_ffi.so
    - test -f .native/native/macos-aarch64/libtresse_ffi.dylib
    - test -f .native/native/windows-x86_64/tresse_ffi.dll
    - test -f src/androidMain/jniLibs/arm64-v8a/libtresse_ffi.so
    - test -f src/androidMain/jniLibs/armeabi-v7a/libtresse_ffi.so
    - test -f src/androidMain/jniLibs/x86_64/libtresse_ffi.so
    - TRESSE_PREBUILT_NATIVE_DIR="$CI_PROJECT_DIR/.native" gradle --no-daemon publishKotlinMultiplatformPublicationToGitLabRepository publishAndroidReleasePublicationToGitLabRepository publishDesktopPublicationToGitLabRepository
  <<: *release_rules
